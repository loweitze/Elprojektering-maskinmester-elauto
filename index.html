<title>Elprojektering</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: tavle-panel. Faner øverst; i "Kredse" en liste til venstre og redigering + beregning til højre. */
:root{
  --bg:#eef0ec; --panel:#ffffff; --fg:#1a1e1c; --muted:#5d6661; --line:#d5dad5; --line2:#e6e9e5;
  --accent:#1d4f9c; --accent-fg:#ffffff; --soft:#e3e9f3;
  --ok:#1f7a46; --ok-bg:#e2f2e8; --bad:#b3261e; --bad-bg:#f8e3e1; --warn:#8a5a00; --warn-bg:#f8eed6;
  --c-brun:#7a4a22; --c-sort:#1a1a1a; --c-graa:#8b8f8c; --c-blaa:#2a62c9; --c-gron:#3c9a3c; --c-gul:#e5c11f;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --panel:#1d2220; --fg:#e7ebe8; --muted:#9aa49f; --line:#323a36; --line2:#2a312e;
  --accent:#7aa6ec; --accent-fg:#0d1420; --soft:#1f2a3a;
  --ok:#6cc792; --ok-bg:#183326; --bad:#f0857c; --bad-bg:#3a1d1b; --warn:#e2b45a; --warn-bg:#352a14;
  --c-sort:#4a4a4a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141816; --panel:#1d2220; --fg:#e7ebe8; --muted:#9aa49f; --line:#323a36; --line2:#2a312e;
  --accent:#7aa6ec; --accent-fg:#0d1420; --soft:#1f2a3a;
  --ok:#6cc792; --ok-bg:#183326; --bad:#f0857c; --bad-bg:#3a1d1b; --warn:#e2b45a; --warn-bg:#352a14;
  --c-sort:#4a4a4a; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:16px}
.leders{display:flex;gap:4px;margin-bottom:10px}
.leders i{display:block;width:28px;height:6px;border-radius:3px}
.pe{background:repeating-linear-gradient(90deg,var(--c-gron) 0 7px,var(--c-gul) 7px 14px)}
h1{font-family:var(--f-display);font-weight:700;font-size:2.3rem;line-height:1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:68ch}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px}
nav.tabs a{font:600 .92rem var(--f-body);color:var(--muted);padding:7px 12px;border-radius:5px;text-decoration:none}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-fg)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;min-width:0}
.stack{display:grid;gap:16px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px;align-items:start}
.lbl{font:600 .72rem var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
h2{font:600 1.2rem var(--f-display);text-transform:uppercase;letter-spacing:.06em;margin:0 0 10px}
h3{font:600 1rem var(--f-display);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px;color:var(--accent)}
.note{font-size:.82rem;color:var(--muted);max-width:80ch;margin:0}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 12px}
.fg .w2{grid-column:span 2}
@media (max-width:420px){.fg .w2{grid-column:span 1}}
.field{display:grid;gap:3px;align-content:start;min-width:0}
label,.flabel{font-size:.8rem;font-weight:500;color:var(--muted)}
input,select,textarea{font:500 .95rem var(--f-mono);width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);min-width:0}
select{font-family:var(--f-body)}
input[type="checkbox"]{width:auto}
.chk{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--fg);padding-top:6px}
.unit{position:relative}
.unit input{padding-right:46px}
.unit span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:.78rem var(--f-mono);color:var(--muted);pointer-events:none}
.btn{font:600 .85rem var(--f-body);padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}

/* kredse */
.kgrid{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.kgrid{grid-template-columns:minmax(0,1fr)}}
.klist{display:grid;gap:12px;max-height:calc(100vh - 160px);overflow:auto;position:sticky;top:12px}
@media (max-width:900px){.klist{max-height:none;position:static}}
.kgroup .lbl{display:block;padding:0 4px 4px}
.kitem{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;width:100%;text-align:left;font:500 .88rem var(--f-body);padding:6px 8px;border:0;border-radius:5px;background:none;color:var(--fg);cursor:pointer}
.kitem:hover{background:var(--bg)}
.kitem[aria-current="true"]{background:var(--soft);color:var(--accent)}
.kitem.load{color:var(--muted);font-weight:400}
.pill{display:inline-flex;align-items:center;gap:4px;font:600 .7rem var(--f-body);padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.mut{background:var(--bg);color:var(--muted)}
.hero{display:flex;flex-wrap:wrap;gap:10px 28px;align-items:flex-end;justify-content:space-between}
.big{font:700 2.4rem/1.05 var(--f-display)}
.big small{font-size:1.1rem;color:var(--muted);font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.kv div{background:var(--panel);padding:8px 11px;display:grid;gap:1px}
.kv b{font:600 1.02rem var(--f-mono);font-variant-numeric:tabular-nums}
.checks{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:baseline;padding:7px 10px;border-radius:6px;background:var(--bg)}
.checks .v{font:.8rem var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
@media (max-width:560px){.checks li{grid-template-columns:44px 1fr}.checks .v{grid-column:2;text-align:left}}

/* beregning */
.step{border-top:1px solid var(--line);padding:14px 0 4px}
.step h4{font:600 1.02rem var(--f-display);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.step h4 .no{color:var(--muted);font-family:var(--f-mono);font-size:.85rem}
.eq{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;font:.86rem/1.55 var(--f-mono);background:var(--bg);border-radius:6px;padding:9px 12px;margin:6px 0;overflow-x:auto}
.eq .f{color:var(--fg)} .eq .s{color:var(--muted)} .eq .r{color:var(--accent);font-weight:600}
.eq .t{font-family:var(--f-body);font-size:.82rem;color:var(--muted)}
.src{font-size:.78rem;color:var(--muted);margin:4px 0 0;display:flex;gap:6px;flex-wrap:wrap}
.src b{font-weight:600;color:var(--fg)}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:4px 0;font:.78rem var(--f-mono);margin:8px 0}
.chain .z{border:1.5px solid var(--fg);border-radius:3px;padding:4px 8px;background:var(--panel);display:grid;text-align:center;min-width:92px}
.chain .z b{font-family:var(--f-body);font-size:.75rem}
.chain .w{width:18px;height:1.5px;background:var(--fg)}
.chain .srcv{border-radius:50%;width:44px;height:44px;border:1.5px solid var(--fg);display:grid;place-items:center;font-size:.7rem}
.chain .flt{color:var(--bad);font-weight:600;padding-left:4px}

.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.84rem}
th,td{padding:6px 9px;text-align:right;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font:600 .7rem var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);vertical-align:bottom}
th:first-child,td:first-child,.l{text-align:left}
td{font-family:var(--f-mono)}
td.l{font-family:var(--f-body)}
tr.tot td{font-weight:600;border-top:2px solid var(--line)}
.y{color:var(--ok)} .n{color:var(--bad)}
.sld{overflow-x:auto;background:var(--panel)}
.sld svg text{font-family:var(--f-body);fill:var(--fg)}
.sld .mono{font-family:var(--f-mono)}
textarea{min-height:200px;font-size:.78rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-weight:600;font-size:.9rem}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:9px 12px;font-size:.85rem}
.warnbox b{color:inherit}
main a,.note a{color:var(--accent)}
.theme{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px}
.theme button{font:600 .85rem var(--f-body);border:0;background:none;color:var(--muted);padding:6px 10px;border-radius:5px;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--soft);color:var(--accent)}
.why{margin:0 0 6px;max-width:80ch;font-size:.9rem;color:var(--fg)}
.help{margin:2px 0 10px;max-width:80ch;font-size:.84rem;color:var(--muted)}
.guide{max-width:820px}
.guide p,.guide li{max-width:72ch}
.guide ol{padding-left:1.3em;display:grid;gap:10px;margin:8px 0 0}
.guide li b{color:var(--fg)}
.gloss{display:grid;grid-template-columns:minmax(70px,auto) 1fr;gap:6px 16px;margin:8px 0 0}
.gloss dt{font:600 .88rem var(--f-mono);color:var(--accent)}
.gloss dd{margin:0;font-size:.9rem}
</style>

function source(P){
  const S=P.settings,Un=S.Un;
  const stiff=!!P.net.stiff;
  const ZQ=stiff?0:S.cmax*Un*Un/(P.net.Sk*1e6)*1000;
  const XQ=ZQ/Math.sqrt(1+P.net.rx**2),RQ=P.net.rx*XQ;
  const Ur=P.trafo.Ur,Sr=P.trafo.S*1000;
  const ZT=P.trafo.ek/100*Ur*Ur/Sr*1000,RT=P.trafo.Pk*Ur*Ur/(Sr*Sr)*1000,XT=Math.sqrt(Math.max(0,ZT*ZT-RT*RT));
  const xT=XT/(Ur*Ur/Sr*1000),KT=S.useKT?0.95*S.cmax/(1+0.6*xT):1;
  const zQ={r:RQ,x:XQ},zT={r:RT*KT,x:XT*KT};
  return {ZQ,XQ,RQ,ZT,RT,XT,xT,KT,zQ,zT,Z1:cadd(zQ,zT),Zl:cadd(cmul(zQ,2/3),zT),InT:Sr/(SQ3*Un)};
}

    ik2min:S.cmin*Un*1000/(2*cabs(Z1min)),ik1max:S.cmax*Un/SQ3*1000/cabs(Zlmax),ik1min:S.cmin*Un/SQ3*1000/cabs(Zlmin)};
}

    }

    return memoB[bid]={P:Pt,Q:Qt,S:St,I:St/(SQ3*S.Un),cos:St?Pt/St:1,rows};

      iaTxt:`Ia aflæst for gG ${p.In} A ved ${fmt(tReq,1)} s (vejledende tabel, se Kilder)`}}
    else if(t==="gG+TR"){const g=GG[p.In];r={...r,In:+p.In,Iset:+p.Ir,I2f:1.2,I2:1.2*p.Ir,Ia:g?(tReq<=0.4?g[1]:g[0]):NaN,inst:false,ref:"en60947_4",

      iaTxt:`Ia = 1,2 · Im (magnetudløser ${fmt(+p.Im,0)} A + 20 % tolerance)`}}

      iaTxt:`Ia = 1,2 · Ii (momentan udløser ${fmt(+p.Im,0)} A + 20 % tolerance)`}}
    if(+p.IaOv>0){r.Ia=+p.IaOv;r.iaTxt=`Ia indtastet manuelt (${fmt(+p.IaOv,0)} A), fx aflæst på producentens kurve`}
    return r;
  }
  function tReqOf(c){
    if(c.prot.t!=="auto")return {t:+c.prot.t,why:"valgt manuelt"};
    const rating=c.prot.type==="MCCB"||c.prot.type==="MMS"?+c.prot.Ir:+c.prot.In;
    if(c.kind==="board")return {t:5,why:"fordelingskreds (411.3.2.3)"};
    if(c.kind==="socket"&&rating<=63)return {t:0.4,why:"gruppe med stikkontakter ≤ 63 A (411.3.2.2, tabel 41.1, TN 230 V)"};
    if(rating<=32)return {t:0.4,why:"gruppe ≤ 32 A til fast tilsluttet materiel (411.3.2.2, tabel 41.1, TN 230 V)"};

  function du(c,lo){
    const cb=c.cable,ph=lo.ph,U=ph===3?S.Un:S.U0,k=ph===3?SQ3:2,th=THETA_OP[cb.ins];
    const rq=R20[cb.mat][sizeIdx(cb.size)]*(1+ALPHA[cb.mat]*(th-20)),par=Math.max(1,+cb.par||1);
    const sin=Math.sqrt(Math.max(0,1-lo.cos*lo.cos))*(lo.cap?-1:1);
    const dV=k*lo.Ib*cb.L/1000*(rq*lo.cos+cb.x*sin)/par;

  }
  function evalC(c){
    if(memoC[c.id])return memoC[c.id];
    const lo=loadOf(c),{ch,errs}=chainOf(c);
    const thFor=x=>thetaMin(P,x);
    let z1max=src.Z1,z1min=src.Z1,zlmax=src.Zl,zlmin=src.Zl,duUp=0;const elems=[];
    for(const s of ch){if(!s.dim)continue;const a=cableZ(s,null),b=cableZ(s,thFor(s));
      z1max=cadd(z1max,a.L);z1min=cadd(z1min,b.L);zlmax=cadd(zlmax,a.L,a.PE);zlmin=cadd(zlmin,b.L,b.PE);
      const sr=evalC(s);duUp+=sr.du?sr.du.pct:0;elems.push({c:s,a,b})}
    const start=ikSet(P,z1max,z1min,zlmax,zlmin);
    const res={c,lo,ch,errs,start,duUp,elems,src};
    if(!c.dim){memoC[c.id]=res;return res}
    const a=cableZ(c,null),b=cableZ(c,thFor(c));
    res.za=a;res.zb=b;
    res.end=ikSet(P,cadd(z1max,a.L),cadd(z1min,b.L),cadd(zlmax,a.L,a.PE),cadd(zlmin,b.L,b.PE));
    res.iz=iz(c);res.treq=tReqOf(c);res.pr=prot(c,res.treq.t,lo);res.du=du(c,lo);
    res.duTot=duUp+res.du.pct;res.duLim=c.kind==="light"?+S.duLight:+S.duOther;
    const k=KADI[c.cable.ins][c.cable.mat],par=Math.max(1,+c.cable.par||1);
    const ikPh=Math.min(res.end.ik2min,res.end.ik1min);
    const fuse=(c.prot.type==="gG"||c.prot.type==="gG+TR")&&!(+c.prot.IaOv>0)&&GG[c.prot.In];
    const tOf=I=>fuse?fuseTime(+c.prot.In,I):(res.pr.inst&&I>=res.pr.Ia?0.1:res.treq.t);
    const tTrip=tOf(ikPh),tTripPE=tOf(res.end.ik1min);
    res.adi={k,ikPh,tTrip,tTripPE,tPh:(k*c.cable.size*par/ikPh)**2,tPE:(k*(+a.pe)*par/res.end.ik1min)**2};
    if(c.kind==="motor"){const m=lo.mot,Is=m.In*m.IsIn,inr=S.inrush*Is;
      const lim=res.pr.inst?(c.prot.type.startsWith("MCB")?res.pr.Ilow:(S.startCmp==="nom"?res.pr.Im:res.pr.Ilow)):NaN;
      res.mst={Is,inr,lim,ok:res.pr.inst?inr<lim:null}}
    const pr=res.pr,ck=[];
    ck.push({k:"Ib ≤ In",ok:lo.Ib<=pr.Iset+1e-9,v:`${fA(lo.Ib)} ≤ ${fA(pr.Iset)}`});
    ck.push({k:"In ≤ Iz",ok:pr.Iset<=res.iz.iz+1e-9,v:`${fA(pr.Iset)} ≤ ${fA(res.iz.iz)}`});
    ck.push({k:"Fejlbeskyttelse: Ik1,min ≥ Ia",ok:res.end.ik1min>=pr.Ia,v:`${fA(res.end.ik1min)} ≥ ${fA(pr.Ia)} (${fmt(res.treq.t,1)} s)`});
    ck.push({k:"Brydeevne: Icu ≥ Ik3,max ved værnet",ok:c.prot.Icu*1000>=Math.max(start.ik3max,start.ik1max),v:`${fmt(+c.prot.Icu,0)} kA ≥ ${fA(Math.max(start.ik3max,start.ik1max))}`});
    ck.push({k:"Leder tåler kortslutning (k²S² ≥ I²t)",ok:res.adi.tPh>=res.adi.tTrip&&res.adi.tPE>=res.adi.tTripPE,v:`tilladt ${fmt(Math.min(res.adi.tPh,res.adi.tPE),2)} s ≥ ${fmt(Math.max(res.adi.tTrip,res.adi.tTripPE),1)} s`});
    ck.push({k:`Spændingsfald ≤ ${fmt(res.duLim,1)} %`,ok:res.duTot<=res.duLim+1e-9,v:`${fmt(res.duTot,2)} % i alt`});
    if(res.mst&&res.mst.ok!==null)ck.push({k:"Motorstart: indkoblingsstrøm under magnetudløser",ok:res.mst.ok,v:`${fA(res.mst.inr)} < ${fA(res.mst.lim)}`});
    if(errs.length)ck.push({k:"Forsyningsvej",ok:false,v:errs[0]});
    if(!Number.isFinite(res.iz.iz))ck.push({k:"Tabelværdi findes",ok:false,v:"Kombinationen findes ikke i tabellen (Al kun fra 16 mm²)"});

  }
  function busOf(bid){if(bid==="T"){const z=src;return ikSet(P,z.Z1,z.Z1,z.Zl,z.Zl)}const s=supplyOf(bid);if(!s||!s.dim)return null;return evalC(s).end}
  return {src,boardSum,loadOf,evalC,busOf,supplyOf,iz,tReqOf};
}

/* ======================== AUTO-DIMENSIONERING ======================== */
function nextIn(list,x){return list.find(v=>v>=x-1e-9)??list[list.length-1]}
function autoProt(P,c){
  const E=makeEngine(P),lo=E.loadOf(c),Ib=lo.Ib,p=c.prot,S=P.settings;
  const mot=c.kind==="motor"?lo.mot:null,inr=mot?S.inrush*mot.In*mot.IsIn:0;
  const sock=c.kind==="socket"?+c.load.val:0;
  if(p.type.startsWith("MCB")){p.In=nextIn(MCB_IN,Math.max(Ib,sock))}
  else if(p.type==="gG"){p.In=nextIn(Object.keys(GG).map(Number),Math.max(Ib,sock))}
  else if(p.type==="gG+TR"){p.Ir=+Ib.toFixed(1);p.In=nextIn(Object.keys(GG).map(Number),Math.max(Ib*1.6,mot?mot.In*mot.IsIn/4:0))}
  else if(p.type==="MMS"){p.Ir=+Ib.toFixed(1);const need=S.startCmp==="nom"?inr:inr/0.8;
    let r=MMS_R.find(([lo,hi])=>lo<=Ib&&Ib<=hi&&13*hi>need)||MMS_R.find(([lo,hi])=>lo<=Ib&&Ib<=hi)||MMS_R.at(-1);p.Im=13*r[1]}
  else if(p.type==="MCCB"){p.In=nextIn(MCCB_IN,Ib);p.Ir=Math.ceil(Ib);
    const need=mot?(S.startCmp==="nom"?inr*1.05:inr/0.8*1.05):0;p.Im=Math.max(10*p.In,Math.ceil(need/10)*10)}
}
function autoSize(P,c){
  const sizes=SZ.filter(s=>R20[c.cable.mat][sizeIdx(s)]!=null);
  const wasPe=c.cable.pe;let fb=null;
  for(let par=Math.max(1,+c.cable.par||1);par<=4;par++){
    c.cable.par=par;
    for(const s of sizes){c.cable.size=s;if(wasPe!=="same")c.cable.pe=s>16?Math.max(16,SZ.find(z=>z>=s/2)||s):s;
      const r=makeEngine(P).evalC(c);
      const need=r.checks.filter(x=>!x.k.startsWith("Brydeevne")&&!x.k.startsWith("Motorstart"));
      const feedOk=c.kind!=="board"||r.du.pct<=+P.settings.duFeed+1e-9;
      if(need.every(x=>x.ok)&&feedOk)return true;
      if(!fb&&need.every(x=>x.ok||x.k.startsWith("Spændingsfald")))fb={par,s};}
    if(c.kind!=="board")break;
  }
  if(fb){c.cable.par=fb.par;c.cable.size=fb.s;if(wasPe!=="same")c.cable.pe=fb.s}else{c.cable.par=1;c.cable.size=sizes.at(-1)}
  return false;
}
function depth(P,c){let d=0,b=c.from;while(b!=="T"&&d<20){const s=P.circuits.find(x=>x.kind==="board"&&x.toBoard===b);if(!s)break;b=s.from;d++}return d}
function autoAll(P){const cs=P.circuits.filter(c=>c.dim).sort((a,b)=>depth(P,a)-depth(P,b));for(const c of cs){autoProt(P,c);autoSize(P,c)}}

   L.push({t:pr.inst?"Udløsetid: momentan udløsning regnes som højst 0,1 s, når strømmen er over Ia. Ved tider under 0,1 s skal værnets gennemsluppne I²t fra producenten sammenlignes med k²S² = "+fmt((a.k*cb.size)**2/1e6,2)+" MA²s.":(c.prot.type.startsWith("gG")&&!(+c.prot.IaOv>0))?"Udløsetid: sikringens smeltetid ved strømmen er anslået ved log-log interpolation gennem tabelpunkterne for 5 s og 0,4 s, dog mindst 0,1 s. Under 0,1 s skal sikringens gennemsluppne I²t fra producenten sammenlignes med k²S² = "+fmt((a.k*cb.size)**2/1e6,2)+" MA²s.":"Udløsetid: kravet til udkoblingstid bruges som øvre grænse."});
   steps.push({h:"Beskyttelse mod kortslutning",L,src:[cite("hd43","434.5.1 (brydeevne), 434.5.2 og tabel 43A (k-værdier)"),cite("hd54","543.1.2 (PE)")]})}
  // 8 fejlbeskyttelse
  {const L=[{t:`TN-system. Krævet udkoblingstid: ${fmt(r.treq.t,1)} s – ${r.treq.why}.`},{f:"Ia",r:pr.iaTxt},
     {f:"Ik1,min ≥ Ia",s:`${fA(r.end.ik1min)} ≥ ${fA(pr.Ia)}`,r:r.end.ik1min>=pr.Ia?"Opfyldt":"Ikke opfyldt"},
     {f:"Største længde for udkobling",r:`L,max ≈ ${fmt(maxLenFault(P,r),0)} m`}];
   steps.push({h:"Fejlbeskyttelse (automatisk afbrydelse)",L,src:[cite("hd41","411.4.4, tabel 41.1, 411.3.2.2–411.3.2.3"),cite(pr.ref)]})}
  // 9 spændingsfald
  {const d=r.du,L=[];
   L.push({f:`R′θ = R20′ · (1 + α · (${d.th} − 20))`,s:`= ${fmt(R20[cb.mat][sizeIdx(cb.size)],4)} · (1 + ${ALPHA[cb.mat]} · ${d.th-20})`,r:`R′ = ${fmt(d.rq,4)} Ω/km`});
   L.push({f:`ΔU = ${lo.ph===3?"√3":"2"} · Ib · L · (R′ · cos φ + X′ · sin φ)${d.par>1?" / n":""}`,s:`= ${lo.ph===3?"√3":"2"} · ${fmt(lo.Ib,2)} · ${fmt(cb.L/1000,3)} km · (${fmt(d.rq,4)} · ${fmt(lo.cos,3)} + ${fmt(+cb.x,3)} · ${fmt(d.sin,3)})${d.par>1?" / "+d.par:""}`,r:`ΔU = ${fmt(d.dV,2)} V`});
   L.push({f:`Δu = ΔU / ${Uname} · 100 %`,s:`= ${fmt(d.dV,2)} / ${Uv} · 100`,r:`Δu = ${fmt(d.pct,2)} %`});
   if(r.duUp>0)L.push({f:"Δu,samlet = Δu,forsyning + Δu,kreds",s:`= ${fmt(r.duUp,2)} + ${fmt(d.pct,2)}`,r:`Δu,samlet = ${fmt(r.duTot,2)} %`});
   L.push({f:`Δu,samlet ≤ ${fmt(r.duLim,1)} %`,r:r.duTot<=r.duLim?"Opfyldt":"Ikke opfyldt"});
   L.push({t:`Grænse: ${c.kind==="light"?"belysning 3 %":"øvrige forbrugere 5 %"} for installation forsynet fra offentligt lavspændingsnet (type A). Regnet fra transformerens klemmer.`});
   steps.push({h:"Spændingsfald",L,src:[cite("hd52","525 og bilag G, tabel G.52.1")]})}
  // 10 motorstart
  if(r.mst){const s=r.mst,L=[{f:"IS = In · IS/IN",s:`= ${fmt(lo.mot.In,1)} · ${fmt(lo.mot.IsIn,1)}`,r:`IS = ${fmt(s.Is,1)} A`},{f:`Iinrush = ${fmt(S.inrush,1)} · IS (t ≤ 15 ms)`,r:`Iinrush = ${fmt(s.inr,0)} A`}];
   if(s.ok!==null)L.push({f:"Iinrush < magnetudløserens strøm",s:`${fmt(s.inr,0)} A < ${fmt(s.lim,0)} A (${c.prot.type.startsWith("MCB")?"nedre grænse for momentan udløsning":S.startCmp==="nom"?"indstillet værdi":"indstillet værdi − 20 %"})`,r:s.ok?"Opfyldt":"Ikke opfyldt – værnet kan udløse ved start"});
   else L.push({t:"Smeltesikring: kontrollér på sikringens tid/strøm-kurve, at den ikke smelter ved IS i hele starttiden."});
   steps.push({h:"Motorstart",L,src:[cite("opg","Iinrush = 2 · Istart, tinrush ≤ 15 ms"),cite("bilag1"),cite(pr.ref)]})}
  return steps;
}
function fuseTime(In,I){const g=GG[In],n=Math.log(5/0.4)/Math.log(g[1]/g[0]);return Math.max(0.1,0.4*Math.pow(I/g[1],-n))}
function maxLenFault(P,r){ // længde hvor Ik1,min = Ia
  const c=r.c,S=P.settings,target=S.cmin*S.Un/SQ3*1000/r.pr.Ia;
  const up=r.start.Zlmin,th=thetaMin(P,c),f=1+ALPHA[c.cable.mat]*(th-20),par=Math.max(1,+c.cable.par||1);
  const rpm=(R20[c.cable.mat][sizeIdx(c.cable.size)]+R20[c.cable.mat][sizeIdx(r.za.pe)])*f/par,xpm=2*c.cable.x/par;
  let lo=0,hi=100000;for(let i=0;i<60;i++){const m=(lo+hi)/2;Math.hypot(up.r+rpm*m,up.x+xpm*m)>target?hi=m:lo=m}
  return Math.hypot(up.r,up.x)>target?0:lo;
}
function stepsText(P,r,steps){
  const c=r.c;let t=`${c.name}\n${"=".repeat(c.name.length)}\n`;
  steps.forEach((s,i)=>{t+=`\n${i+1}. ${s.h}\n`;if(WHY[s.h])t+=`   ${WHY[s.h]}\n\n`;s.L.forEach(l=>{if(l.t)t+=`   ${l.t}\n`;if(l.f)t+=`   ${l.f}\n`;if(l.s)t+=`     ${l.s}\n`;if(l.r)t+=`     ${l.r}\n`});
    t+=`   Kilde: ${s.src.map(x=>SRC[x.k]+(x.extra?", "+x.extra:"")).join("; ")}\n`});
  return t;
}

const WHY={
 "Belastningsstrøm Ib":"Først findes den strøm, kredsen skal føre i normal drift. Alt andet dimensioneres ud fra den. For en motor bruges mærkestrømmen fra databladet. For en tavle lægges alle kredse på tavlen sammen, ganget med antal og samtidighedsfaktor, fordi ikke alt kører på samme tid.",
 "Overstrømsbeskyttelse":"Værnet skal afbryde, før kablet bliver for varmt. Her bestemmes værnets mærkestrøm eller indstilling (In eller Ir), som bruges i kontrollen af overbelastning.",
 "Kablets strømværdi Iz":"Iz er den strøm, kablet kan føre hele tiden, uden at isoleringen bliver for varm. Tabelværdien gælder for standardforhold: 30 °C i luft (20 °C i jord) og kablet alene. Varmere omgivelser og flere kabler tæt sammen giver dårligere køling, så tabelværdien ganges med korrektionsfaktorer.",
 "Beskyttelse mod overbelastning":"Kablet er beskyttet mod overbelastning, når værnet er mindst lige så stort som belastningen, men ikke større end kablet kan tåle: Ib ≤ In ≤ Iz.",
 "Impedanser":"For at regne kortslutningsstrømme skal alle impedanser fra spændingskilden til fejlstedet kendes: nettet bag transformeren, transformeren og hvert kabel på vejen. Den største strøm fås med kolde ledere (20 °C), den mindste med varme ledere, fordi modstanden stiger med temperaturen.",
 "Kortslutningsstrømme":"Den største strøm (Ik,max) ved værnet bruges til at kontrollere, at værnet kan bryde strømmen. Den mindste strøm (Ik,min) i enden af kablet bruges til at kontrollere, at værnet udløser hurtigt nok ved en fejl langt ude. c-faktoren tager højde for, at netspændingen kan variere.",
 "Beskyttelse mod kortslutning":"Værnet skal kunne afbryde den største kortslutningsstrøm uden at gå i stykker (brydeevne Icu). Desuden må lederne ikke blive så varme under kortslutningen, at isoleringen tager skade. Den energi, der slipper igennem (I²t), skal være mindre end den energi, lederen kan tåle (k²S²).",
 "Fejlbeskyttelse (automatisk afbrydelse)":"Ved en isolationsfejl mellem en fase og en udsat del, fx et motorhus, kan der opstå farlig berøringsspænding. Værnet skal derfor afbryde inden for den tid, standarden kræver. Det sker kun, hvis fejlstrømmen Ik1,min er mindst lige så stor som den strøm Ia, der får værnet til at udløse inden for tiden.",
 "Spændingsfald":"Strømmen giver et spændingsfald i kablet. Bliver det for stort, får udstyret for lav spænding: motorer starter dårligt, og lys flimrer. Spændingsfaldet lægges sammen fra transformeren og ud til forbrugeren og sammenlignes med grænsen.",
 "Motorstart":"Når en motor starter, trækker den mange gange sin mærkestrøm i kort tid. Værnets magnetiske udløser må ikke slå fra under starten, så dens indstilling skal ligge over indkoblingsstrømmen.",
 "Net og transformer":"Nettet og transformeren er spændingskilden for hele installationen. Deres impedanser bestemmer, hvor store kortslutningsstrømmene kan blive ved transformerens klemmer. Nettets impedans findes ud fra kortslutningseffekten, transformerens ud fra kortslutningsspændingen uk og kobbertabet Pk."
};

function inp(scope,path,val,o={}){const t=o.type||"number";

  return o.unit?`<div class="unit">${el}<span>${o.unit}</span></div>`:el}
function sel_(scope,path,val,opts,num){return `<select id="${scope}-${path}" data-scope="${scope}" data-k="${path}" ${num?'data-num="1"':""} data-re="1">${opts.map(([v,t])=>`<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(t)}</option>`).join("")}</select>`}
function fld(label,html,cls=""){return `<div class="field ${cls}"><span class="flabel">${label}</span>${html}</div>`}
function chk(scope,path,val,label){return `<label class="chk"><input type="checkbox" id="${scope}-${path}" data-scope="${scope}" data-k="${path}" data-re="1" ${val?"checked":""}> ${label}</label>`}

document.addEventListener("input",e=>{const el=e.target;if(!el.dataset?.k||el.type==="checkbox"||el.tagName==="SELECT")return;apply(el,false)});
document.addEventListener("change",e=>{const el=e.target;if(!el.dataset?.k)return;if(el.type==="checkbox"||el.tagName==="SELECT")apply(el,true)});
function apply(el,re){
  const obj=el.dataset.scope==="c"?P.circuits.find(c=>c.id===sel):P;if(!obj)return;
  let v=el.type==="checkbox"?el.checked:el.value;
  if(el.dataset.num){if(v==="same"){}else v=v===""?0:+v}
  setP(obj,el.dataset.k,v);
  if(el.dataset.scope==="c"){const c=obj;
    if(el.dataset.k==="kind"){if(c.kind==="motor")c.load.type="motor";else if(c.load.type==="motor")c.load.type="P";if(c.kind==="board"&&!c.toBoard)c.toBoard=P.boards.find(b=>b.id!==c.from)?.id||""}
    if(el.dataset.k==="cable.mat"&&R20[c.cable.mat][sizeIdx(c.cable.size)]==null){c.cable.size=16;c.cable.pe="same"}
    if(el.dataset.k==="cable.method"){if(c.cable.method==="D2"){c.cable.group="jord";c.cable.temp=15}else if(c.cable.method==="D1"){c.cable.group="jordror";c.cable.temp=15}else if(c.cable.group.startsWith("jord")){c.cable.group="bundt";c.cable.temp=30}}
  }
  save();
  if(re)render();else refresh();
}

  return `<div class="step"><h4>${no?`<span class="no">${String(no).padStart(2,"0")}</span>`:""}${esc(s.h)}</h4>${why?`<p class="why">${esc(why)}</p>`:""}
   <div class="eq">${s.L.map(l=>(l.t?`<div class="t">${esc(l.t)}</div>`:"")+(l.f?`<div class="f">${esc(l.f)}</div>`:"")+(l.s?`<div class="s">${esc(l.s)}</div>`:"")+(l.r?`<div class="r">${esc(l.r)}</div>`:"")).join("")}</div>
   ${extra}<div class="src">Kilde: ${s.src.map(x=>`<span><b>${esc(SRC[x.k].split(" – ")[0])}</b>${x.extra?", "+esc(x.extra):""}</span>`).join(" · ")}</div></div>`;
}
function chainHtml(items,end){
  return `<div class="chain"><div class="srcv">c·U</div>${items.map(([n,z])=>`<div class="w"></div><div class="z"><b>${esc(n.length>22?n.slice(0,21)+"…":n)}</b>${fmt(z.r,2)} + j${fmt(z.x,2)}</div>`).join("")}<div class="w"></div><span class="flt">✕ ${esc(end)}</span></div>`;
}
function copy(t){const done=()=>toast("Kopieret");try{navigator.clipboard.writeText(t).then(done,()=>fallback(t))}catch(e){fallback(t)}}
function fallback(t){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");toast("Kopieret")}catch(e){toast("Markér teksten og kopiér manuelt")}ta.remove()}

/* ---------- Belastning ---------- */

  const E=makeEngine(P);
  m.innerHTML=`<div class="stack"><div class="panel"><h2>Belastning pr. tavle</h2><p class="help">Her lægges belastningerne sammen for hver tavle. Hver kreds bidrager med sin effekt ganget med antal og samtidighedsfaktor. P og Q lægges sammen hver for sig, og den samlede strøm findes ud fra S. Resultatet er Ib for tavlens forsyningskreds.</p></div>${P.boards.map(b=>{const s=E.boardSum(b.id);
   return `<div class="panel"><div class="hero"><h2 style="margin:0">${esc(b.name)}</h2><span class="note">I alt ${fmt(s.S/1000,1)} kVA · ${fmt(s.I,1)} A · cos φ ${fmt(s.cos,3)}</span></div>
   <div class="tblwrap" style="margin-top:8px"><table><thead><tr><th>Kreds</th><th>Antal</th><th>Ib pr. stk</th><th>P pr. stk<br>kW</th><th>Q pr. stk<br>kvar</th><th>Faktor</th><th>P bidrag<br>kW</th><th>Q bidrag<br>kvar</th></tr></thead><tbody>
   ${s.rows.map(x=>`<tr><td class="l">${esc(x.c.name)}</td><td>${x.c.n}</td><td>${fmt(x.lo.Ib,1)}</td><td>${fmt(x.lo.P/1000,2)}</td><td>${fmt(x.lo.Q/1000,2)}</td><td>${fmt(+x.c.factor,2)}</td><td>${fmt(x.P/1000,2)}</td><td>${fmt(x.Q/1000,2)}</td></tr>`).join("")}
   <tr class="tot"><td class="l">Sum</td><td></td><td></td><td></td><td></td><td></td><td>${fmt(s.P/1000,2)}</td><td>${fmt(s.Q/1000,2)}</td></tr></tbody></table></div>
   <div class="eq" style="margin-top:10px"><div class="f">S = √(ΣP² + ΣQ²) = √(${fmt(s.P/1000,2)}² + ${fmt(s.Q/1000,2)}²)</div><div class="r">S = ${fmt(s.S/1000,2)} kVA,  I = S / (√3 · ${P.settings.Un} V) = ${fmt(s.I,1)} A</div></div>
   <p class="src">Kilde: <b>Opgaveoplæg</b>, belastningsoversigt og samtidighedsfaktorer. Motorer: <b>bilag 1</b> (P = √3 · U · In · cos φ). 1-fasede laster regnes som jævnt fordelt på faserne.</p></div>`}).join("")}</div>`;
}

/* ---------- Enstreg ---------- */
function vEnstreg(m){
  const E=makeEngine(P);
  const kids=b=>P.circuits.filter(c=>c.from===b&&c.dim);
  const W=210,H=220,ROW0=80;
  const leaves=b=>{const k=kids(b);if(!k.length)return 1;return k.reduce((s,c)=>s+(c.kind==="board"?leaves(c.toBoard):1),0)};
  let svg="",maxD=0;
  function place(b,x0,d,y){ // bus for board b at y
    const k=kids(b),w=leaves(b)*W;maxD=Math.max(maxD,d);
    const bus=E.busOf(b);
    if(b==="T"){const tx=x0+W/2;svg+=`<circle cx="${tx}" cy="${y-30}" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="${tx}" cy="${y-14}" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/>
       <text x="${tx+22}" y="${y-34}" font-size="12" font-weight="600">Transformer ${fmt(P.trafo.S,0)} kVA, bygning 6</text><text x="${tx+22}" y="${y-20}" font-size="11" class="mono">Ik3,max ${fA(bus.ik3max)} · Ik1,max ${fA(bus.ik1max)}</text>`;}
    else{const xs=k.length?[x0+W/2,x0+w-W/2]:[x0+W/2-30,x0+W/2+30];
      svg+=`<line x1="${xs[0]-20}" y1="${y}" x2="${xs[1]+20}" y2="${y}" stroke="currentColor" stroke-width="4"/>
       <text x="${xs[0]+8}" y="${y-36}" font-size="13" font-weight="600">${esc(boardName(b))}</text>
       <text x="${xs[0]+8}" y="${y-21}" font-size="11" class="mono">${bus?`Ik3,max ${fA(bus.ik3max)}`:"ingen forsyning regnet"}</text>
       <text x="${xs[0]+8}" y="${y-8}" font-size="11" class="mono">${bus?`Ik1,min ${fA(bus.ik1min)}`:""}</text>`}
    let x=x0;
    for(const c of k){const lw=(c.kind==="board"?leaves(c.toBoard):1)*W,cx=x+W/2,r=E.evalC(c);
      const y2=c.kind==="board"?y+H:y+120;const col=r.ok?"var(--ok)":"var(--bad)";
      svg+=`<line x1="${cx}" y1="${y}" x2="${cx}" y2="${y2}" stroke="currentColor" stroke-width="1.5"/>
       <rect x="${cx-7}" y="${y+14}" width="14" height="24" fill="var(--panel)" stroke="currentColor" stroke-width="1.5"/>
       <text x="${cx+12}" y="${y+24}" font-size="11" class="mono">${esc(protName(c))}</text>
       <text x="${cx+12}" y="${y+56}" font-size="11.5" font-weight="600">${esc(c.name.length>24?c.name.slice(0,23)+"…":c.name)}</text>
       <text x="${cx+12}" y="${y+70}" font-size="11" class="mono">${esc(cableName(c))}</text>
       <text x="${cx+12}" y="${y+84}" font-size="11" class="mono">${fS(c.cable.L)} m · Ib ${fA(r.lo.Ib)}</text>
       <circle cx="${cx+12+3}" cy="${y+96}" r="4" fill="${col}"/><text x="${cx+24}" y="${y+100}" font-size="11">${r.ok?"OK":r.checks.filter(x=>!x.ok).length+" fejl"} · Δu ${fmt(r.duTot,1)} %</text>`;
      if(c.kind==="board")place(c.toBoard,x,d+1,y2);
      else svg+=`<path d="M${cx-6},${y2-8} L${cx},${y2} L${cx+6},${y2-8}" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <text x="${cx+12}" y="${y2-2}" font-size="11" class="mono">Ik1,min ${fA(r.end.ik1min)}</text>`;
      x+=lw}
  }
  const totalW=leaves("T")*W+40;place("T",20,0,ROW0);
  const Ht=ROW0+(maxD+1)*H+60;
  const E2=E;const rows=[["Transformerens klemmer",E2.busOf("T")],...P.circuits.filter(c=>c.dim).map(c=>[c.kind==="board"?boardName(c.toBoard)+" (skinne)":c.name+" (slut)",E2.evalC(c).end])];
  m.innerHTML=`<div class="stack"><div class="panel"><h2>Enstregsdiagram</h2><p class="note">Viser de kredse, der dimensioneres. Kortslutningsstrømme er angivet på tavleskinner og i enden af hver gruppe. Rød prik betyder, at et krav ikke er opfyldt.</p>
   <div class="sld" style="margin-top:10px"><svg width="${totalW}" height="${Ht}" viewBox="0 0 ${totalW} ${Ht}" style="color:var(--fg)">${svg}</svg></div></div>
   <div class="panel"><h2>Kortslutningsstrømme</h2><div class="tblwrap"><table><thead><tr><th>Sted</th><th>Ik3,max</th><th>Ik3,min</th><th>Ik2,min</th><th>Ik1,max</th><th>Ik1,min</th><th>|Z1,max| mΩ</th><th>|ZS,min| mΩ</th></tr></thead><tbody>
   ${rows.map(([n,k])=>`<tr><td class="l">${esc(n)}</td><td>${fA(k.ik3max)}</td><td>${fA(k.ik3min)}</td><td>${fA(k.ik2min)}</td><td>${fA(k.ik1max)}</td><td>${fA(k.ik1min)}</td><td>${fmt(cabs(k.Z1max),2)}</td><td>${fmt(cabs(k.Zlmin),2)}</td></tr>`).join("")}</tbody></table></div>
   <p class="src">Kilde: <b>DS/EN 60909-0</b>. cmax = ${fmt(P.settings.cmax,2)}, cmin = ${fmt(P.settings.cmin,2)}. Maks. ved 20 °C, min. ved ${P.settings.thetaMin==="drift"?"driftstemperatur":P.settings.thetaMin+" °C"}.</p></div></div>`;
}

/* ---------- Selektivitet ---------- */
function vSelekt(m){
  const E=makeEngine(P);const blocks=[];
  for(const b of P.boards){const feed=E.supplyOf(b.id);if(!feed||!feed.dim)continue;
    const outs=P.circuits.filter(c=>c.from===b.id&&c.dim);if(!outs.length)continue;
    const bus=E.busOf(b.id);
    const rows=outs.map(o=>{const up=feed.prot,dn=o.prot;let st,txt;
      const upIn=up.type==="MCCB"||up.type==="MMS"?+up.Ir:+up.In,dnIn=dn.type==="MCCB"||dn.type==="MMS"?+dn.Ir:+dn.In;
      if(up.type.startsWith("gG")&&dn.type.startsWith("gG")){const ra=upIn/(+dn.In);st=ra>=1.6?"ok":"bad";txt=`gG/gG: forhold ${fmt(ra,2)} (krav ≥ 1,6)`}
      else if(up.type==="MCCB"&&bus){const lo=0.8*up.Im;st=lo>bus.ik3max?"ok":"warn";txt=st==="ok"?`Total selektivitet: 0,8 · Ii = ${fA(lo)} > Ik3,max ${fA(bus.ik3max)}`:`Delvis: 0,8 · Ii = ${fA(lo)} < Ik3,max ${fA(bus.ik3max)}. Brug producentens selektivitetstabel.`}
      else {st="warn";txt=`Forhold In ${fmt(upIn/dnIn,2)}. Kontrollér tid/strøm-kurver eller producentens selektivitetstabel ved Ik3,max ${bus?fA(bus.ik3max):"–"}.`}
      return {o,st,txt}});
    blocks.push(`<div class="panel"><h2>${esc(b.name)}</h2><p class="note">For-værn: ${esc(feed.name)} – ${esc(protName(feed))}</p>
      <div class="tblwrap" style="margin-top:8px"><table><thead><tr><th>Efter-værn</th><th>Værn</th><th>Vurdering</th><th class="l">Begrundelse</th></tr></thead><tbody>
      ${rows.map(x=>`<tr><td class="l">${esc(x.o.name)}</td><td class="l">${esc(protName(x.o))}</td><td><span class="pill ${x.st}">${x.st==="ok"?"Selektiv":x.st==="bad"?"Ikke selektiv":"Kontrollér"}</span></td><td class="l" style="white-space:normal;min-width:260px">${esc(x.txt)}</td></tr>`).join("")}</tbody></table></div></div>`)}
  m.innerHTML=`<div class="stack"><div class="panel"><h2>Selektivitet</h2><p class="note">Kun tavlens forsyningsværn sammenlignes med de udgående kredse, der dimensioneres. Selektivitet mellem bygning 6 og 2 er stikledningens sikring i transformerstationen mod værnene i -U1. Reglerne er enkle tommelfingerregler og erstatter ikke producentens selektivitetstabeller.</p>
   <p class="src">Kilde: <b>DS/EN 60269-1</b> (gG-sikringer selektive ved mærkestrømsforhold 1,6:1) · <b>DS/EN 60947-2</b> bilag A (selektivitet for effektafbrydere) · <b>DS/HD 60364-5-53</b> 536.4.</p></div>${blocks.join("")||`<div class="panel"><p class="note">Ingen tavler med både forsynings- og udgående kredse.</p></div>`}</div>`;
}

  <div class="cols">

   <div class="panel"><h2>Jordens termiske modstand</h2><div class="tblwrap"><table><thead><tr><th>K·m/W</th><th>I rør (D1)</th><th>Direkte (D2)</th></tr></thead><tbody>
   ${SOIL.D1.map(([k],i)=>`<tr><td>${k}</td><td>${SOIL.D1[i][1]}</td><td>${SOIL.D2[i][1]}</td></tr>`).join("")}</tbody></table></div><p class="src">Tabel B.52.16.</p></div>
   <div class="panel"><h2>k-værdier</h2><div class="tblwrap"><table><thead><tr><th>Isolering</th><th>Cu</th><th>Al</th></tr></thead><tbody><tr><td class="l">PVC ≤ 300 mm²</td><td>115</td><td>76</td></tr><tr><td class="l">PEX</td><td>143</td><td>94</td></tr></tbody></table></div><p class="src">DS/HD 60364-4-43 tabel 43A.</p></div>
  </div>
  <div class="panel"><h2>Samlet fremføring kg</h2><div class="tblwrap"><table><thead><tr><th>Fremføring</th><th>Tabel</th>${[1,2,3,4,5,6,7,8,9,12,16,20].map(n=>`<th>${n}</th>`).join("")}</tr></thead><tbody>

/* ---------- Gem og hent ---------- */
function vGem(m){
  m.innerHTML=`<div class="cols"><div class="panel stack"><h2>Gem projekt</h2><p class="note">Projektet gemmes automatisk i denne browser. For at gemme en kopi eller flytte projektet til en anden computer: kopiér teksten herunder og gem den i en fil.</p>
   <textarea id="exp" readonly>${esc(JSON.stringify(P,null,1))}</textarea><div class="btns"><button class="btn primary" id="cpyExp">Kopiér projektdata</button></div></div>
   <div class="panel stack"><h2>Hent projekt</h2><p class="note">Indsæt tidligere gemte projektdata og tryk Hent. Det nuværende projekt bliver erstattet.</p>
   <textarea id="imp" placeholder="Indsæt projektdata her"></textarea><div class="btns"><button class="btn primary" id="doImp">Hent</button></div><p class="note" id="impMsg"></p>
   <div class="sec stack"><h3>Start forfra</h3><div class="btns"><button class="btn" id="ex">Indlæs eksemplet (Hansens maskinfabrik)</button><button class="btn danger" id="blank">Tomt projekt</button></div><p class="note" id="rsMsg"></p></div></div></div>`;
  $("#cpyExp").onclick=()=>copy($("#exp").value);
  $("#doImp").onclick=()=>{try{const x=JSON.parse($("#imp").value);if(!x.circuits||!x.net)throw 0;P=x;save();toast("Projektet er hentet");location.hash="kredse"}catch(e){$("#impMsg").textContent="Teksten kunne ikke læses som projektdata. Kopiér hele teksten fra Gem projekt."}};
  const confirm2=(btn,fn)=>{if(btn.dataset.sure){fn()}else{document.querySelectorAll("#ex,#blank").forEach(b=>{delete b.dataset.sure;b.textContent=b.dataset.lbl});btn.dataset.sure=1;btn.textContent="Klik igen for at bekræfte";$("#rsMsg").textContent="Det nuværende projekt bliver erstattet. Gem en kopi først, hvis du vil beholde det."}};
  document.querySelectorAll("#ex,#blank").forEach(b=>b.dataset.lbl=b.textContent);
  const go=h=>{sel=null;if(location.hash==="#"+h)render();else location.hash=h};
  $("#ex").onclick=e=>confirm2(e.currentTarget,()=>{P=example();autoAll(P);save();toast("Eksemplet er indlæst");go("kredse")});
  $("#blank").onclick=e=>confirm2(e.currentTarget,()=>{const x=example();x.name="Nyt projekt";x.circuits=[];x.boards=[{id:"U1",name:"Hovedtavle -U1"}];P=x;save();toast("Tomt projekt oprettet. Start med net og transformer.");go("projekt")});
}

render();
